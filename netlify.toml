[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Preview builds (deploy previews and branch deploys) show the draft notes and the Chief tracing tool.
[context.deploy-preview.environment]
  NEXT_PUBLIC_BUILD_NOTES = "1"
[context.branch-deploy.environment]
  NEXT_PUBLIC_BUILD_NOTES = "1"

# Topo tiles used as card/hero backdrops are fetched once and cached by Netlify's image CDN,
# so visitors don't each hit the free tile server.
[images]
  remote_images = ["https://tile\\.opentopomap\\.org/.*", "https://server\\.arcgisonline\\.com/.*"]
